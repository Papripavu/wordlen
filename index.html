<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121213">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Wordlen">
<meta name="description" content="A daily word game: one shared word a day at 5, 6 and 7 letters, plus unlimited practice. Share your result as colored squares.">
<title>Wordlen — a daily word game</title>
<style>
  :root{
    --bg:#121213; --panel:#1a1a1b; --border:#3a3a3c; --border-soft:#2a2a2c;
    --text:#f8f8f8; --text-dim:#a1a1a6;
    --key:#818384; --key-text:#f8f8f8;
    --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c;
    --accent:#6aaa64;
    --gap:clamp(3px,1.1vw,6px);
    --radius:6px;
    --header-h:58px;
    font-size:16px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    touch-action:manipulation; -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  button{font-family:inherit; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    height:var(--header-h); padding:0 clamp(8px,2.5vw,16px);
    border-bottom:1px solid var(--border-soft); flex:none;
  }
  .brand{
    font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    font-size:clamp(1.05rem,4.4vw,1.6rem); margin:0; user-select:none;
  }
  .brand span{color:var(--accent);}
  .hgroup{display:flex; gap:4px; align-items:center;}
  .icon-btn{
    background:none; border:0; color:var(--text); cursor:pointer;
    width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
    transition:background .15s ease;
  }
  .icon-btn:hover{background:#ffffff14;}
  .icon-btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .icon-btn svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;}

  /* ---------- length toggle ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:center; gap:clamp(6px,2vw,14px);
    padding:8px 10px; flex:none; flex-wrap:wrap;
  }
  .seg-label{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);}
  .seg{display:flex; background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:3px;}
  .seg button{
    background:none; border:0; color:var(--text-dim); cursor:pointer;
    padding:5px 12px; border-radius:999px; font-size:.85rem; font-weight:700;
    transition:background .15s ease,color .15s ease; min-width:34px;
  }
  .seg button[aria-pressed="true"]{background:var(--accent); color:#fff;}
  .seg button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .newgame{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:999px; padding:7px 15px; font-size:.82rem; font-weight:700; cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
  }
  .newgame:hover{background:#2c2c2e; border-color:var(--key);}
  .newgame:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none !important;}
  .seg button.done{position:relative;}
  .seg button.done::after{
    content:''; position:absolute; top:3px; right:5px; width:5px; height:5px;
    border-radius:50%; background:var(--correct);
  }
  .seg button[aria-pressed="true"].done::after{background:#fff;}
  .subbar{
    flex:none; text-align:center; font-size:.72rem; color:var(--text-dim);
    padding:0 10px 6px; line-height:1.3;
  }
  .subbar b{color:var(--text); font-weight:700;}
  .share-btn{display:inline-flex; align-items:center; gap:8px;}
  .share-btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round;}
  .countdown{font-size:.78rem; color:var(--text-dim); margin:12px 0 0; font-variant-numeric:tabular-nums;}
  .countdown b{color:var(--text); font-weight:700;}

  /* ---------- board ---------- */
  main{flex:1 1 auto; display:flex; align-items:center; justify-content:center; min-height:0; padding:4px 8px; overflow:hidden;}
  #board{
    /* --tile is measured by fitBoard() so the grid always fits width AND height */
    --tile:min(56px, calc((92vw - (var(--cols) - 1) * var(--gap)) / var(--cols)));
    display:grid; gap:var(--gap); justify-content:center;
  }
  .row{display:grid; grid-template-columns:repeat(var(--cols),var(--tile)); gap:var(--gap);}
  .tile{
    width:var(--tile); height:var(--tile);
    display:grid; place-items:center;
    font-size:calc(var(--tile)*.5); font-weight:800; text-transform:uppercase;
    border:2px solid var(--border-soft); color:var(--text);
    user-select:none; line-height:1;
  }
  .tile[data-filled="true"]{border-color:var(--key); animation:pop .1s ease-out;}
  .tile[data-state="correct"]{background:var(--correct); border-color:var(--correct);}
  .tile[data-state="present"]{background:var(--present); border-color:var(--present);}
  .tile[data-state="absent"] {background:var(--absent);  border-color:var(--absent);}
  .tile.flip{animation:flip .5s ease forwards;}
  .row.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97);}
  .row.win .tile{animation:bounce .55s ease;}

  @keyframes pop{from{transform:scale(.9);opacity:.6;} to{transform:scale(1);opacity:1;}}
  @keyframes flip{0%{transform:rotateX(0);}50%{transform:rotateX(-90deg);}100%{transform:rotateX(0);}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}
    30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
  @keyframes bounce{0%,20%{transform:translateY(0);}40%{transform:translateY(-26px);}
    50%{transform:translateY(4px);}60%{transform:translateY(-12px);}80%{transform:translateY(2px);}
    100%{transform:translateY(0);}}

  /* ---------- keyboard ---------- */
  #keyboard{flex:none; padding:6px clamp(3px,1.5vw,8px) max(8px,env(safe-area-inset-bottom)); user-select:none;}
  .krow{display:flex; justify-content:center; gap:clamp(3px,1.2vw,6px); margin-bottom:clamp(4px,1.2vw,8px);}
  .krow:last-child{margin-bottom:0;}
  .key{
    flex:1 1 auto; max-width:44px; height:clamp(44px,7.4vh,58px);
    background:var(--key); color:var(--key-text); border:0; border-radius:var(--radius);
    font-size:clamp(.72rem,3.1vw,.95rem); font-weight:700; text-transform:uppercase; cursor:pointer;
    display:grid; place-items:center;
    transition:background .12s ease, transform .06s ease;
  }
  .key:active{transform:scale(.94);}
  .key.wide{flex:1.6 1 auto; max-width:72px; font-size:clamp(.6rem,2.4vw,.72rem);}
  .key svg{width:20px;height:20px;fill:currentColor;}
  .key[data-state="correct"]{background:var(--correct);}
  .key[data-state="present"]{background:var(--present);}
  .key[data-state="absent"] {background:var(--absent); color:#8e8e93;}
  .key:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .spacer{flex:.5 1 auto;}

  /* ---------- toast ---------- */
  #toaster{
    position:fixed; top:calc(var(--header-h) + 56px); left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:8px; z-index:60; pointer-events:none;
    width:max-content; max-width:90vw;
  }
  .toast{
    background:#f8f8f8; color:#121213; font-weight:700; font-size:.88rem;
    padding:11px 16px; border-radius:6px; box-shadow:0 6px 24px #0009;
    animation:toastIn .18s ease;
  }
  .toast.out{animation:toastOut .3s ease forwards;}
  @keyframes toastIn{from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:none;}}
  @keyframes toastOut{to{opacity:0; transform:translateY(-6px);}}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; top:0; right:0; bottom:0; left:0; background:#000000b8;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    display:grid; place-items:center; z-index:80; padding:16px;
    animation:fade .2s ease;
  }
  .overlay[hidden]{display:none;}
  @keyframes fade{from{opacity:0;} to{opacity:1;}}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    width:min(440px,100%); max-height:88vh; overflow-y:auto; padding:22px;
    box-shadow:0 20px 60px #000a; animation:rise .24s cubic-bezier(.2,.8,.3,1);
    text-align:center; position:relative;
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:none;}}
  .modal h2{margin:0 0 6px; font-size:1.35rem; letter-spacing:.02em;}
  .modal .close{position:absolute; top:10px; right:10px;}
  .verdict{font-size:.92rem; color:var(--text-dim); margin:0 0 16px;}
  .verdict strong{color:var(--accent); letter-spacing:.14em; text-transform:uppercase; font-size:1.05rem;}
  .stats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0 18px;}
  .stat b{display:block; font-size:1.7rem; font-weight:800; line-height:1.1;}
  .stat span{font-size:.68rem; color:var(--text-dim); line-height:1.2; display:block; margin-top:3px;}
  .dist-title{font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px;}
  .dist{display:flex; flex-direction:column; gap:4px; margin-bottom:18px;}
  .dist-row{display:flex; align-items:center; gap:8px; font-size:.8rem;}
  .dist-row i{font-style:normal; width:12px; color:var(--text-dim); text-align:right;}
  .bar{
    background:var(--absent); height:20px; border-radius:3px; min-width:22px;
    display:flex; align-items:center; justify-content:flex-end; padding:0 6px;
    font-size:.72rem; font-weight:700; transition:width .5s cubic-bezier(.2,.8,.3,1);
  }
  .bar.hot{background:var(--correct);}
  .modal-actions{display:flex; gap:10px; justify-content:center;}
  .btn{
    border:0; border-radius:999px; padding:11px 22px; font-size:.9rem; font-weight:700; cursor:pointer;
    background:var(--accent); color:#fff; transition:filter .15s ease;
  }
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  .btn:hover{filter:brightness(1.08);}
  .btn:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  .help{text-align:left; font-size:.88rem; line-height:1.55; color:#e6e6e6;}
  .help h2{text-align:center;}
  .help ul{padding-left:18px; margin:10px 0;}
  .help li{margin-bottom:6px;}
  .ex{display:flex; gap:4px; margin:10px 0 4px;}
  .ex .tile{width:36px; height:36px; font-size:1.05rem; border-width:2px;}
  .help p.small{color:var(--text-dim); font-size:.8rem;}
  hr{border:0; border-top:1px solid var(--border-soft); margin:16px 0;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;}

  @media (max-height:640px){
    :root{--header-h:48px;}
    .toolbar{padding:5px 8px;}
    .key{height:clamp(34px,6.6vh,46px);}
  }
  @media (max-height:460px){
    :root{--header-h:38px; --gap:3px;}
    .brand{font-size:1rem;}
    .toolbar{padding:3px 6px; gap:8px;}
    .seg button{padding:3px 9px; font-size:.78rem;}
    .newgame{padding:5px 11px; font-size:.75rem;}
    .krow{margin-bottom:3px;}
    .key{height:clamp(24px,8vh,38px); font-size:.7rem;}
    #keyboard{padding:3px 4px 4px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="btn-help" aria-label="How to play" title="How to play">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.6 2.6 0 1 1 3.4 2.5c-.6.2-.9.8-.9 1.4v.4"/><circle cx="12" cy="17" r=".9" fill="currentColor" stroke="none"/></svg>
  </button>
  <h1 class="brand">Word<span>len</span></h1>
  <div class="hgroup">
    <button class="icon-btn" id="btn-stats" aria-label="Statistics" title="Statistics">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-6"/></svg>
    </button>
  </div>
</header>

<div class="toolbar">
  <div class="seg" role="group" aria-label="Game mode" id="mode-seg"></div>
  <div class="seg" role="group" aria-label="Word length" id="len-seg"></div>
  <button class="newgame" id="btn-new">New Game</button>
</div>
<div class="subbar" id="subbar"></div>

<main><div id="board" role="grid" aria-label="Guess board"></div></main>

<div id="keyboard"></div>

<div id="toaster" role="status" aria-live="polite"></div>
<div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal"></div>
</div>

/* ---------------- dictionary: curated targets + bloom-filter guess validation --------------- */
const Dict = (() => {
  let bits = null;
  const targetSets = {};
  for (const n of Object.keys(DATA.targets)) targetSets[n] = new Set(DATA.targets[n]);

  function decode() {
    if (bits) return bits;
    const bin = atob(DATA.bloom);
    bits = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bits[i] = bin.charCodeAt(i);
    return bits;
  }
  function fnv(s, basis) {
    let h = basis >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function inBloom(w) {
    const b = decode(), m = DATA.m, k = DATA.k;
    const h1 = fnv(w, 2166136261), h2 = (fnv(w, 16777619) | 1) >>> 0;
    for (let i = 0; i < k; i++) {
      const idx = (h1 + i * h2) % m;
      if (!(b[idx >> 3] >> (idx & 7) & 1)) return false;
    }
    return true;
  }
  return {
    targets: n => DATA.targets[n],
    isTarget: (n, w) => targetSets[n].has(w),
    isValid(n, w) {
      if (targetSets[n] && targetSets[n].has(w)) return true;
      try { return inBloom(w); } catch (e) { return false; }
    }
  };
})();

/* ---------------- constants ---------------- */
const LENGTHS = [5, 6, 7];
const DEFAULT_LEN = 5;
const FLIP_MS = 500, FLIP_STAGGER = 260;
const EPOCH = [2026, 7, 21];            // 21 Aug 2026 (month is 0-based) is Daily #1
const K = {
  stats: 'wordlen.stats.v2', daily: 'wordlen.daily.v1', practice: 'wordlen.practice.v1',
  pref: 'wordlen.pref.v1', last: 'wordlen.last.v1', seen: 'wordlen.seen.v1',
  legacyStats: 'wordlen.stats.v1', legacyGame: 'wordlen.game.v1'
};
const PRAISE = ['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Nice', 'Phew', 'Just made it', 'Clutch'];

const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------- the daily word ----------------
   Everyone gets the same word with no server involved: the day number indexes a
   fixed shuffle of the curated list, and every copy of the page computes it the
   same way. Heads-up for future edits: reordering or resizing a target list
   reshuffles every future daily word, so treat the lists as frozen once shared.
   Each player also stores the word they started on, so a mid-day redeploy can't
   swap the answer underneath them. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const dailyOrder = (() => {
  const seq = {};
  for (const n of LENGTHS) {
    const idx = DATA.targets[n].map((_, i) => i);
    const rnd = mulberry32(0x5EED + n);              // fixed seed, identical everywhere
    for (let i = idx.length - 1; i > 0; i--) {       // Fisher-Yates
      const j = Math.floor(rnd() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    seq[n] = idx;
  }
  return seq;
})();

// Local midnight defines the day, so the counter is immune to DST and timezone offsets.
function dayStamp(d) { return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()); }
function dayNumber(now) {
  const start = Date.UTC(EPOCH[0], EPOCH[1], EPOCH[2]);
  return Math.floor((dayStamp(now || new Date()) - start) / 86400000) + 1;
}
function dailyWord(len, day) {
  const seq = dailyOrder[len];
  const i = ((day - 1) % seq.length + seq.length) % seq.length;
  return DATA.targets[len][seq[i]];
}
function msUntilNextWord() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1) - n;
}
function formatGap(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const p = v => String(v).padStart(2, '0');
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}

/* ---------------- state ---------------- */
let S = null;          // active game
let busy = false;      // true while the flip animation runs

const $ = sel => document.querySelector(sel);
const boardEl = $('#board'), kbEl = $('#keyboard'), toaster = $('#toaster');
const overlay = $('#overlay'), modal = $('#modal');

function maxAttempts(len) { return len + 1; }

function newState(mode, len, target, day) {
  return {
    mode, len, rows: maxAttempts(len), target, day: day || 0,
    guesses: [], states: [], current: '', row: 0,
    over: false, won: false, pendingClear: false
  };
}

/* ---------------- starting games ---------------- */
function startDaily(len) {
  const day = dayNumber();
  const saved = (store.get(K.daily, {}) || {})[len];
  S = newState('daily', len, dailyWord(len, day), day);
  if (saved && saved.day === day && Array.isArray(saved.guesses) && Array.isArray(saved.states)) {
    if (typeof saved.target === 'string' && saved.target.length === len) S.target = saved.target;
    S.guesses = saved.guesses.slice();
    S.states = saved.states.slice();
    S.row = S.guesses.length;
    S.over = !!saved.over;
    S.won = !!saved.won;
  }
  busy = false;
  savePref(); saveGame(); renderAll();
}

function pickWord(len) {
  const pool = Dict.targets(len);
  const last = (store.get(K.last, {}) || {})[len];
  let w;
  do { w = pool[Math.floor(Math.random() * pool.length)]; }
  while (pool.length > 1 && w === last);
  const lasts = store.get(K.last, {}) || {}; lasts[len] = w; store.set(K.last, lasts);
  return w;
}

function startPractice(len, opts) {
  S = newState('practice', len, pickWord(len));
  busy = false;
  savePref(); saveGame(); renderAll();
  if (!(opts && opts.silent)) announce(`New practice game, ${len} letters, ${S.rows} attempts.`);
}

function restorePractice() {
  const g = store.get(K.practice, null);
  if (!g || !LENGTHS.includes(g.len) || typeof g.target !== 'string' || g.target.length !== g.len) return false;
  if (!Array.isArray(g.guesses) || !Array.isArray(g.states)) return false;
  S = newState('practice', g.len, g.target);
  S.guesses = g.guesses.slice(); S.states = g.states.slice();
  S.row = S.guesses.length; S.over = !!g.over; S.won = !!g.won;
  return true;
}

function savePref() { store.set(K.pref, { mode: S.mode, len: S.len }); }

function saveGame() {
  if (!S) return;
  if (S.mode === 'daily') {
    const all = store.get(K.daily, {}) || {};
    all[S.len] = {
      day: S.day, target: S.target, guesses: S.guesses, states: S.states,
      over: S.over, won: S.won
    };
    for (const k of Object.keys(all)) if (!all[k] || all[k].day !== S.day) delete all[k];
    store.set(K.daily, all);
  } else {
    store.set(K.practice, {
      len: S.len, target: S.target, guesses: S.guesses, states: S.states,
      over: S.over, won: S.won
    });
  }
}

function dailyDone(len) {
  const d = (store.get(K.daily, {}) || {})[len];
  return !!(d && d.day === dayNumber() && d.over);
}

/* ---------------- rendering ---------------- */
function renderAll() {
  document.documentElement.style.setProperty('--cols', S.len);
  boardEl.style.setProperty('--cols', S.len);
  renderBoard();
  renderKeyboard();
  renderModeSeg();
  renderSeg();
  renderSubbar();
  $('#btn-new').hidden = S.mode !== 'practice';
  fitBoard();
}

// Size tiles so the whole grid fits the free space: 8 rows of 7 tiles must not clip.
function fitBoard() {
  const main = boardEl.parentElement;
  const gap = parseFloat(getComputedStyle(boardEl).gap) || 5;
  const availW = Math.min(main.clientWidth - 16, 480);
  const availH = main.clientHeight - 10;
  const byWidth = (availW - (S.len - 1) * gap) / S.len;
  const byHeight = (availH - (S.rows - 1) * gap) / S.rows;
  const tile = Math.max(10, Math.min(byWidth, byHeight, 62));
  boardEl.style.setProperty('--tile', tile.toFixed(2) + 'px');
}

function renderModeSeg() {
  const seg = $('#mode-seg');
  seg.innerHTML = '';
  [['daily', 'Daily'], ['practice', 'Practice']].forEach(([m, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(S.mode === m));
    b.addEventListener('click', () => {
      if (S.mode === m) return;
      if (m === 'daily') startDaily(S.len);
      else if (!restorePracticeSameLength()) startPractice(S.len, { silent: true });
    });
    seg.appendChild(b);
  });
}

// Switching to Practice resumes an unfinished practice game when it matches the length.
function restorePracticeSameLength() {
  const want = S.len;
  if (!restorePractice()) return false;
  if (S.len !== want || S.over) { startPractice(want, { silent: true }); return true; }
  busy = false; savePref(); renderAll();
  return true;
}

function renderSeg() {
  const seg = $('#len-seg');
  seg.innerHTML = '';
  for (const n of LENGTHS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = n;
    b.setAttribute('aria-pressed', String(n === S.len));
    b.setAttribute('aria-label', `${n} letter words`);
    if (S.mode === 'daily' && dailyDone(n)) {
      b.classList.add('done');
      b.title = `Daily ${n} complete`;
    }
    b.addEventListener('click', () => {
      if (S.mode === 'daily') { if (n !== S.len) startDaily(n); }
      else if (n !== S.len || S.over) startPractice(n);
    });
    seg.appendChild(b);
  }
}

function renderSubbar() {
  const el = $('#subbar');
  if (S.mode === 'daily') {
    el.innerHTML = S.over
      ? `<b>Daily #${S.day}</b> &middot; ${S.len} letters &middot; done for today &mdash; next word in <b id="sub-clock">${formatGap(msUntilNextWord())}</b>`
      : `<b>Daily #${S.day}</b> &middot; everyone gets the same word today`;
    startClock('sub-clock');
  } else {
    el.textContent = 'Practice — random words, results are not shared';
    stopClock();
  }
}

let clockTimer = null;
function startClock(id) {
  stopClock();
  const tick = () => {
    const nodes = [document.getElementById(id), document.getElementById('modal-clock')].filter(Boolean);
    if (!nodes.length) return;
    const left = msUntilNextWord();
    if (left <= 1000) { location.reload(); return; }   // roll over to the new day
    nodes.forEach(n => { n.textContent = formatGap(left); });
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}
function stopClock() { if (clockTimer) { clearInterval(clockTimer); clockTimer = null; } }

function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < S.rows; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.setProperty('--cols', S.len);
    row.setAttribute('role', 'row');
    for (let c = 0; c < S.len; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.setAttribute('role', 'gridcell');
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
  S.guesses.forEach((g, r) => {
    const tiles = boardEl.children[r].children;
    for (let c = 0; c < S.len; c++) {
      tiles[c].textContent = g[c];
      tiles[c].dataset.filled = 'true';
      tiles[c].dataset.state = S.states[r][c];
    }
  });
  paintCurrentRow();
}

function paintCurrentRow() {
  if (S.row >= S.rows) return;
  const tiles = boardEl.children[S.row].children;
  for (let c = 0; c < S.len; c++) {
    const ch = S.current[c] || '';
    if (tiles[c].textContent !== ch) {
      tiles[c].textContent = ch;
      if (ch) tiles[c].dataset.filled = 'true'; else delete tiles[c].dataset.filled;
    }
  }
}

const KB_ROWS = ['qwertyuiop', 'asdfghjkl', '↵zxcvbnm⌫'];
function renderKeyboard() {
  kbEl.innerHTML = '';
  KB_ROWS.forEach((rowStr, i) => {
    const row = document.createElement('div');
    row.className = 'krow';
    if (i === 1) row.appendChild(spacer());
    for (const ch of rowStr) {
      const k = document.createElement('button');
      k.type = 'button';
      k.className = 'key';
      if (ch === '↵') { k.classList.add('wide'); k.textContent = 'Enter'; k.dataset.key = 'Enter'; k.setAttribute('aria-label', 'Enter'); }
      else if (ch === '⌫') {
        k.classList.add('wide'); k.dataset.key = 'Backspace'; k.setAttribute('aria-label', 'Backspace');
        k.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 5H8.5L2 12l6.5 7H21a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-3.6 9.9-1.4 1.4L13 13.4l-3 3-1.4-1.4 3-3-3-3L10 7.6l3 3 3-3 1.4 1.4-3 3 3 2.9z"/></svg>';
      } else { k.textContent = ch; k.dataset.key = ch; }
      row.appendChild(k);
    }
    if (i === 1) row.appendChild(spacer());
    kbEl.appendChild(row);
  });
  repaintKeyboard();
}
function spacer() { const s = document.createElement('div'); s.className = 'spacer'; return s; }

const RANK = { absent: 0, present: 1, correct: 2 };
function repaintKeyboard() {
  const best = {};
  S.guesses.forEach((g, r) => {
    for (let c = 0; c < S.len; c++) {
      const ch = g[c], st = S.states[r][c];
      if (!(ch in best) || RANK[st] > RANK[best[ch]]) best[ch] = st;
    }
  });
  kbEl.querySelectorAll('.key').forEach(k => {
    const ch = k.dataset.key;
    if (ch && ch.length === 1 && best[ch]) k.dataset.state = best[ch];
    else delete k.dataset.state;
  });
}

/* ---------------- wordle evaluation (handles duplicate letters) ---------------- */
function evaluate(guess, target) {
  const n = guess.length;
  const res = new Array(n).fill('absent');
  const counts = {};
  for (let i = 0; i < n; i++) {
    if (guess[i] === target[i]) res[i] = 'correct';
    else counts[target[i]] = (counts[target[i]] || 0) + 1;
  }
  for (let i = 0; i < n; i++) {
    if (res[i] === 'correct') continue;
    const ch = guess[i];
    if (counts[ch] > 0) { res[i] = 'present'; counts[ch]--; }
  }
  return res;
}

/* ---------------- input ---------------- */
function addLetter(ch) {
  if (busy || S.over) return;
  // The last guess was rejected as not-a-word and is still shown. Typing starts a
  // clean row instead of making the player backspace over every letter.
  if (S.pendingClear) {
    S.pendingClear = false;
    S.current = '';
    paintCurrentRow();
  }
  if (S.current.length >= S.len) return;
  S.current += ch;
  paintCurrentRow();
}
function removeLetter() {
  if (busy || S.over || !S.current.length) return;
  S.pendingClear = false;   // editing by hand overrides the auto-clear
  S.current = S.current.slice(0, -1);
  paintCurrentRow();
}
function submitGuess() {
  if (busy || S.over) return;
  const guess = S.current;
  const rowEl = boardEl.children[S.row];
  if (guess.length < S.len) return reject(rowEl, 'Not enough letters');
  if (!Dict.isValid(S.len, guess)) { S.pendingClear = true; return reject(rowEl, 'Not in word list'); }

  const state = evaluate(guess, S.target);
  S.guesses.push(guess);
  S.states.push(state);
  S.current = '';
  S.pendingClear = false;
  const won = state.every(s => s === 'correct');
  const rowIdx = S.row;
  S.row++;
  S.over = won || S.row >= S.rows;
  S.won = won;
  saveGame();
  animateRow(rowEl, state, () => finishTurn(rowEl, rowIdx, won));
}

function reject(rowEl, msg) {
  toast(msg);
  rowEl.classList.remove('shake');
  void rowEl.offsetWidth;
  rowEl.classList.add('shake');
  setTimeout(() => rowEl.classList.remove('shake'), 600);
}

function animateRow(rowEl, state, done) {
  busy = true;
  const tiles = rowEl.children;
  for (let c = 0; c < S.len; c++) {
    const tile = tiles[c];
    tile.style.animationDelay = `${c * FLIP_STAGGER}ms`;
    tile.classList.add('flip');
    setTimeout(() => { tile.dataset.state = state[c]; }, c * FLIP_STAGGER + FLIP_MS / 2);
  }
  setTimeout(() => {
    for (const t of tiles) { t.classList.remove('flip'); t.style.animationDelay = ''; }
    busy = false;
    done();
  }, (S.len - 1) * FLIP_STAGGER + FLIP_MS);
}

function finishTurn(rowEl, rowIdx, won) {
  repaintKeyboard();
  announce(`Row ${rowIdx + 1}: ${S.states[rowIdx].map((s, i) => S.guesses[rowIdx][i] + ' ' + s).join(', ')}`);
  if (won) {
    rowEl.classList.add('win');
    recordResult(true, rowIdx + 1);
    renderSeg(); renderSubbar();
    toast(PRAISE[Math.min(rowIdx, PRAISE.length - 1)]);
    setTimeout(() => showEndModal(true, rowIdx + 1), 1500);
  } else if (S.over) {
    recordResult(false, 0);
    renderSeg(); renderSubbar();
    toast(S.target.toUpperCase(), 2400);
    setTimeout(() => showEndModal(false, 0), 1800);
  }
}

/* ---------------- stats (kept separately for Daily and Practice) ---------------- */
function blankStats() { return { played: 0, wins: 0, streak: 0, maxStreak: 0, dist: {}, lastDay: 0 }; }
function allStats() {
  const a = store.get(K.stats, null) || {};
  if (!a.daily) a.daily = {};
  if (!a.practice) a.practice = {};
  return a;
}
function getStats(mode, len) {
  const a = allStats();
  return Object.assign(blankStats(), (a[mode] || {})[len] || {});
}
function recordResult(won, guessNum) {
  const a = allStats();
  const s = Object.assign(blankStats(), (a[S.mode] || {})[S.len] || {});
  s.played++;
  if (won) {
    s.wins++;
    s.dist[guessNum] = (s.dist[guessNum] || 0) + 1;
    // A daily streak counts consecutive days; practice just counts consecutive wins.
    s.streak = (S.mode === 'daily') ? (s.lastDay === S.day - 1 ? s.streak + 1 : 1) : s.streak + 1;
    s.maxStreak = Math.max(s.maxStreak, s.streak);
  } else s.streak = 0;
  if (S.mode === 'daily') s.lastDay = S.day;
  a[S.mode][S.len] = s;
  store.set(K.stats, a);
}

// Stats saved before Daily mode existed were all practice games.
(function migrateLegacyStats() {
  const legacy = store.get(K.legacyStats, null);
  if (!legacy) return;
  const a = allStats();
  for (const len of Object.keys(legacy)) {
    if (!a.practice[len]) a.practice[len] = Object.assign(blankStats(), legacy[len]);
  }
  store.set(K.stats, a);
  store.del(K.legacyStats);
  store.del(K.legacyGame);
})();

/* ---------------- sharing ---------------- */
const EMOJI = { correct: '🟩', present: '🟨', absent: '⬛' };
function shareText() {
  const score = S.won ? S.guesses.length : 'X';
  const head = `Wordlen ${S.len} #${S.day} ${score}/${S.rows}`;
  const grid = S.states.map(r => r.map(x => EMOJI[x]).join('')).join('\n');
  const url = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : '';
  return head + '\n\n' + grid + (url ? '\n\n' + url : '');
}

async function shareResult() {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }   // user dismissed the sheet
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(text); toast('Copied to clipboard'); return; } catch (e) {}
  }
  // Fallback for file:// pages and older browsers, where the clipboard API is blocked.
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0;';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  toast(ok ? 'Copied to clipboard' : 'Copy failed — select the grid manually');
}

/* ---------------- toast + announcer ---------------- */
function toast(msg, ms = 1400) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  toaster.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 300);
  }, ms);
}
function announce(msg) { $('#announcer').textContent = msg; }

/* ---------------- modals ---------------- */
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  modal.innerHTML = html;
  overlay.hidden = false;
  const btn = modal.querySelector('button');
  if (btn) btn.focus();
}
function closeModal() {
  overlay.hidden = true;
  modal.innerHTML = '';
  if (S && S.mode === 'daily' && S.over) startClock('sub-clock');
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

function statsMarkup(mode, len, highlight) {
  const s = getStats(mode, len);
  const pct = s.played ? Math.round(s.wins / s.played * 100) : 0;
  const rows = maxAttempts(len);
  const max = Math.max(1, ...Object.values(s.dist));
  let dist = '';
  for (let i = 1; i <= rows; i++) {
    const v = s.dist[i] || 0;
    const w = Math.round(v / max * 100);
    dist += `<div class="dist-row"><i>${i}</i><div class="bar${highlight === i ? ' hot' : ''}" style="width:${Math.max(w, 8)}%">${v}</div></div>`;
  }
  return `
    <div class="stats-grid">
      <div class="stat"><b>${s.played}</b><span>Played</span></div>
      <div class="stat"><b>${pct}</b><span>Win %</span></div>
      <div class="stat"><b>${s.streak}</b><span>${mode === 'daily' ? 'Day streak' : 'Win streak'}</span></div>
      <div class="stat"><b>${s.maxStreak}</b><span>Max streak</span></div>
    </div>
    <div class="dist-title">${mode === 'daily' ? 'Daily' : 'Practice'} distribution &middot; ${len} letters</div>
    <div class="dist">${dist}</div>`;
}

const SHARE_ICON = '<svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg>';

function showEndModal(won, guessNum) {
  const daily = S.mode === 'daily';
  const title = won ? 'You got it!' : 'Out of guesses';
  const sub = won
    ? `<strong>${PRAISE[Math.min(guessNum - 1, PRAISE.length - 1)]}</strong><br>Solved in ${guessNum} of ${S.rows} guesses.`

    ? `<button class="btn share-btn" id="m-share">${SHARE_ICON}Share result</button>
       <button class="btn ghost" id="m-practice">Practice</button>`

       <button class="btn ghost" id="m-close">Close</button>`;
  openModal(`
    <button class="icon-btn close" id="m-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="modal-title">${title}</h2>
    <p class="verdict">${daily ? `Daily #${S.day} &middot; ${S.len} letters<br>` : ''}${sub}</p>

    $('#m-close').addEventListener('click', closeModal);
  }
}

function showStatsModal() {
  const daily = S.mode === 'daily';
  const canShare = daily && S.over;
  openModal(`
    <button class="icon-btn close" id="m-x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="modal-title">${daily ? 'Daily' : 'Practice'} statistics</h2>
    <p class="verdict">${daily
      ? 'Daily results are tracked per word length. Your streak counts consecutive days.'
      : 'Practice games are tracked separately and never shared.'}</p>
    ${statsMarkup(S.mode, S.len, 0)}
    <div class="modal-actions">
      ${canShare ? `<button class="btn share-btn" id="m-share">${SHARE_ICON}Share result</button>` : ''}
      <button class="btn${canShare ? ' ghost' : ''}" id="m-close">Done</button>
    </div>`);
  $('#m-x').addEventListener('click', closeModal);
  $('#m-close').addEventListener('click', closeModal);
  if (canShare) $('#m-share').addEventListener('click', shareResult);
}

function showHelpModal() {
  openModal(`

    <div class="help">

        <li>One try per day: once a daily word is finished it stays finished until midnight.</li>
        <li><b>Practice</b> plays random words as often as you like, and is never shared.</li>
        <li>Pick <b>5, 6 or 7</b> letters at the top — each length has its own daily word.</li>
        <li>Type on your keyboard or tap the on-screen keys.</li>
      </ul>
      <div class="modal-actions"><button class="btn" id="m-close">Got it</button></div>
    </div>`);
  $('#m-x').addEventListener('click', closeModal);
  $('#m-close').addEventListener('click', closeModal);
}

/* ---------------- events ---------------- */
document.addEventListener('keydown', e => {
  if (!overlay.hidden) {
    if (e.key === 'Escape') closeModal();
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') { e.preventDefault(); submitGuess(); }
  else if (e.key === 'Backspace') { e.preventDefault(); removeLetter(); }
  else if (e.key === ' ') { e.preventDefault(); }
  else if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); addLetter(e.key.toLowerCase()); }
});

kbEl.addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  const key = k.dataset.key;
  if (key === 'Enter') submitGuess();
  else if (key === 'Backspace') removeLetter();
  else addLetter(key);
});

// A mouse-clicked button keeps DOM focus, so a later physical Enter/Space would re-fire it
// (double submit). e.detail === 0 means the click came from the keyboard, where focus must stay.
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && e.detail > 0) b.blur();
});

$('#btn-new').addEventListener('click', () => startPractice(S.len));
$('#btn-stats').addEventListener('click', showStatsModal);
$('#btn-help').addEventListener('click', showHelpModal);

// keep the board fitted when the viewport changes (rotation, mobile URL bar, resize)
window.addEventListener('resize', fitBoard);
window.addEventListener('orientationchange', () => setTimeout(fitBoard, 150));
if (window.ResizeObserver) new ResizeObserver(fitBoard).observe(boardEl.parentElement);
if (window.visualViewport) window.visualViewport.addEventListener('resize', fitBoard);

// A tab left open overnight should pick up the new daily word.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S && S.mode === 'daily' && S.day !== dayNumber()) startDaily(S.len);
});

/* ---------------- boot ---------------- */
const pref = store.get(K.pref, null) || {};
const startLen = LENGTHS.includes(pref.len) ? pref.len : DEFAULT_LEN;
if (pref.mode === 'practice' && restorePractice()) { renderAll(); }
else startDaily(startLen);

if (!store.get(K.seen, false)) {
  showHelpModal();
  store.set(K.seen, true);
} else if (S.mode === 'daily' && S.over) {
  // Returning after finishing: surface the result and the share button.
  setTimeout(() => showEndModal(S.won, S.won ? S.guesses.length : 0), 350);
}
</script>
</body>
</html>
